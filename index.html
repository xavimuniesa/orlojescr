<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orloj — Rellotge astronòmic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --nit: #0a1330;
    --nit2: #142452;
    --pedra: #211a13;
    --pedra2: #16110c;
    --or: #d4af37;
    --or-clar: #f2d98a;
    --or-fosc: #8a6d1f;
    --or-viu: #f0c65c;
    --ivori: #f2e8d0;
    --vermell: #7a1f1f;
    --arg: #c9d2e0;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #3a2c18 0%, transparent 55%),
      radial-gradient(ellipse at 50% 120%, #000 0%, transparent 60%),
      linear-gradient(180deg, var(--pedra) 0%, var(--pedra2) 100%);
    color: var(--ivori);
    font-family: 'Cormorant Garamond', serif;
  }

  body{
    height: 100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:
      max(16px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
  }

  .marc{
    width:100%;
    max-width: 1260px;
    border-radius: 22px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(212,175,55,0.06), transparent 60%),
      linear-gradient(180deg, #1b140d 0%, #100c08 100%);
    padding: clamp(18px, 2.6vw, 34px) clamp(24px, 3.4vw, 46px);
    position: relative;
  }

  .contingut{
    display:flex;
    align-items:center;
    gap: clamp(20px, 3.5vw, 48px);
  }
  .columna-esq{
    flex: 1 1 58%;
    min-width: 0;
    text-align:center;
  }
  .columna-dre{
    flex: 1 1 38%;
    min-width: 0;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  @media (max-width: 780px){
    .contingut{ flex-direction:column; }
    .columna-esq, .columna-dre{ flex: 1 1 auto; width:100%; }
  }

  header{
    text-align:center;
    margin-bottom: 4px;
  }
  h1{
    font-family: 'UnifrakturMaguntia', cursive;
    font-weight: 400;
    font-size: clamp(32px, 4.4vw, 52px);
    margin: 4px 0 2px;
    color: var(--or-clar);
    text-shadow: 0 0 18px rgba(212,175,55,0.35);
    letter-spacing: 1px;
  }
  .subtitol{
    font-family: 'Cinzel', serif;
    font-size: clamp(10px, 1.3vw, 13px);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--or-viu);
    font-weight: 600;
    text-shadow: 0 0 6px rgba(240,198,92,0.35);
  }
  .subtitol-secundari{
    font-family: 'Cinzel', serif;
    font-size: clamp(7px, 0.85vw, 9px);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--or-fosc);
    font-weight: 600;
  }

  .disc-wrap{
    width: 100%;
    max-width: 660px;
    margin: 14px auto 0;
    display:block;
  }
  .disc-wrap svg{ width:100%; height:auto; display:block; overflow:visible; }

  .calendari-wrap{
    width: 78%;
    max-width: 355px;
    margin: 4px auto 0;
    position: relative;
    z-index: 2;
  }
  .calendari-wrap svg{ width:100%; height:auto; display:block; }

  .lectura{
    text-align:center;
    margin-top: 22px;
    font-family:'Cinzel', serif;
  }
  .hora-digital{
    font-size: clamp(28px, 3.4vw, 40px);
    letter-spacing: 0;
    color: var(--or-clar);
    text-shadow: 0 0 12px rgba(212,175,55,0.3);
  }
  .hora-digital .xifra{
    display: inline-block;
    width: 0.62em;
    text-align: center;
  }
  .hora-digital .separador-hora{
    display: inline-block;
    width: 0.32em;
    text-align: center;
  }
  .data-digital{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(15px, 1.7vw, 19px);
    color: var(--arg);
    margin-top: 3px;
  }
  .luna-linia{
    margin-top: 9px;
    font-size: clamp(12px, 1.3vw, 14px);
    letter-spacing: 1.5px;
    color: var(--or-viu);
    font-weight: 600;
    text-transform: uppercase;
  }

  .ambient-linia{
    margin-top: 5px;
    font-size: clamp(10px, 2.4vw, 12px);
    letter-spacing: 1.2px;
    color: var(--or-viu);
    text-transform: uppercase;
    opacity: 0.9;
  }
  .ambient-linia .separador-punt{
    color: var(--or-fosc);
    margin: 0 5px;
  }

  .separador{
    width: 70%;
    max-width: 260px;
    height: 1px;
    margin: 20px auto;
    background: linear-gradient(90deg, transparent, var(--or-fosc), transparent);
  }

  .lema{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(12px, 1.3vw, 14px);
    color: #8b7a5e;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  text{ font-family:'Cinzel', serif; user-select:none; }
  .num-antic{ font-family:'UnifrakturMaguntia', cursive; }

  @media (prefers-reduced-motion: reduce){
    * { transition: none !important; }
  }
</style>
</head>
<body>

  <div class="marc">
    <div class="contingut">
      <div class="columna-esq">
        <header>
          <div class="subtitol">Praga · MCDX</div>
          <h1>Orloj</h1>
          <div class="subtitol-secundari">Homenatge al rellotge astronòmic</div>
        </header>

        <div class="disc-wrap">
          <svg id="astrolabi" viewBox="0 0 600 600"></svg>
        </div>
      </div>

      <div class="columna-dre">
        <div class="calendari-wrap">
          <svg id="calendari" viewBox="0 0 300 300"></svg>
        </div>

        <div class="separador"></div>

        <div class="lectura">
          <div class="hora-digital" id="lecturaHora">--:--:--</div>
          <div class="data-digital" id="lecturaData">—</div>
          <div class="luna-linia" id="lecturaLluna">—</div>
      <div class="ambient-linia"><span id="lecturaTemp">--°C</span><span class="separador-punt">·</span><span id="lecturaAlt">-- m</span></div>
        </div>

        <div class="separador"></div>
        <p class="lema">"Tempus fugit, sed astra manent"</p>
      </div>
    </div>
  </div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const CX = 300, CY = 300;

  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function polarX(cx, r, angDeg){ return cx + r * Math.sin(angDeg * Math.PI/180); }
  function polarY(cy, r, angDeg){ return cy - r * Math.cos(angDeg * Math.PI/180); }

  const svg = document.getElementById('astrolabi');
  svg.setAttribute('overflow','visible');

  // ---------- DEFS ----------
  const defs = el('defs', {});
  const skyGrad = el('radialGradient', {id:'ceil', cx:'50%', cy:'42%', r:'75%'});
  skyGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#1c2f66'}));
  skyGrad.appendChild(el('stop', {offset:'55%', 'stop-color':'#101c45'}));
  skyGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#060b1f'}));
  defs.appendChild(skyGrad);

  const goldGrad = el('linearGradient', {id:'orBanda', x1:'0%', y1:'0%', x2:'0%', y2:'100%'});
  goldGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#f3de9a'}));
  goldGrad.appendChild(el('stop', {offset:'50%', 'stop-color':'#c9a227'}));
  goldGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#8a6d1f'}));
  defs.appendChild(goldGrad);

  const ivoriGrad = el('linearGradient', {id:'ivoriBanda', x1:'0%', y1:'0%', x2:'0%', y2:'100%'});
  ivoriGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#fbf6e6'}));
  ivoriGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#e4d6ac'}));
  defs.appendChild(ivoriGrad);

  const hubGrad = el('radialGradient', {id:'nucli', cx:'35%', cy:'30%', r:'70%'});
  hubGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#f6e6a6'}));
  hubGrad.appendChild(el('stop', {offset:'60%', 'stop-color':'#c9a227'}));
  hubGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#6e5416'}));
  defs.appendChild(hubGrad);

  const lunaGranGrad = el('radialGradient', {id:'lunaGranBanda', cx:'38%', cy:'32%', r:'75%'});
  lunaGranGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#faf3d9'}));
  lunaGranGrad.appendChild(el('stop', {offset:'60%', 'stop-color':'#e6d19f'}));
  lunaGranGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#b99a5c'}));
  defs.appendChild(lunaGranGrad);

  const perlaGrad = el('radialGradient', {id:'perlaBanda', cx:'32%', cy:'28%', r:'75%'});
  perlaGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#eafcfa'}));
  perlaGrad.appendChild(el('stop', {offset:'30%', 'stop-color':'#4dd0c4'}));
  perlaGrad.appendChild(el('stop', {offset:'70%', 'stop-color':'#159084'}));
  perlaGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#063f38'}));
  defs.appendChild(perlaGrad);

  const solGrad = el('radialGradient', {id:'solBanda', cx:'35%', cy:'32%', r:'70%'});
  solGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#fffadd'}));
  solGrad.appendChild(el('stop', {offset:'45%', 'stop-color':'#f6d76a'}));
  solGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#c9861a'}));
  defs.appendChild(solGrad);

  const lunaLitGrad = el('radialGradient', {id:'lunaLitBanda', cx:'32%', cy:'30%', r:'75%'});
  lunaLitGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#fffdf6'}));
  lunaLitGrad.appendChild(el('stop', {offset:'55%', 'stop-color':'#e8e2c8'}));
  lunaLitGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#b8ae8e'}));
  defs.appendChild(lunaLitGrad);

  const lunaDarkGrad = el('radialGradient', {id:'lunaDarkBanda', cx:'62%', cy:'68%', r:'75%'});
  lunaDarkGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#3a4258'}));
  lunaDarkGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#1a1e2c'}));
  defs.appendChild(lunaDarkGrad);

  svg.appendChild(defs);

  // ---------- Anells de fons ----------
  svg.appendChild(el('circle', {cx:CX, cy:CY, r:294, fill:'none', stroke:'#5c4a1c', 'stroke-width':2}));
  svg.appendChild(el('circle', {cx:CX, cy:CY, r:288, fill:'url(#orBanda)'}));

  // Anell "temps antic" (numeració daurada sobre negre, ornamental)
  svg.appendChild(el('circle', {cx:CX, cy:CY, r:280, fill:'#0c0c0c'}));
  const anticGrup = el('g', {});
  for (let i=1;i<=24;i++){
    const ang = i*15;
    const t = el('text', {
      x: polarX(CX,272,ang), y: polarY(CY,272,ang),
      fill:'#f0c65c', 'font-size':'14', 'font-weight':'700', 'text-anchor':'middle',
      class:'num-antic',
      transform:`rotate(${ang}, ${polarX(CX,272,ang)}, ${polarY(CY,272,ang)})`
    });
    t.textContent = i;
    anticGrup.appendChild(t);
  }
  svg.appendChild(anticGrup);

  // Anell romà (funcional — hores)
  svg.appendChild(el('circle', {cx:CX, cy:CY, r:265, fill:'url(#ivoriBanda)', stroke:'#8a6d1f', 'stroke-width':1}));
  const romans = ['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
  const romGrup = el('g', {});
  const estiramentRoman = 1.45;
  romans.forEach((r,i)=>{
    const ang = i*30;
    const rx = polarX(CX,228,ang), ry = polarY(CY,228,ang);
    const g = el('g', {transform: `translate(${rx}, ${ry}) rotate(${ang}) scale(1, ${estiramentRoman})`});
    // Ombra (dona efecte de gravat/relleu sobre la banda de vori)
    const ombra = el('text', {
      x: 0.6, y: 5.5,
      fill:'#5c4416', opacity:'0.45', 'font-size':'23', 'font-weight':'600', 'letter-spacing':'1.2',
      'text-anchor':'middle'
    });
    ombra.textContent = r;
    g.appendChild(ombra);
    const t = el('text', {
      x: 0, y: 5,
      fill:'#241a08', 'font-size':'23', 'font-weight':'600', 'letter-spacing':'1.2',
      'text-anchor':'middle'
    });
    t.textContent = r;
    g.appendChild(t);
    romGrup.appendChild(g);
  });
  svg.appendChild(romGrup);

  // Perla articulada: viatja per la vora entre l'anell antic i l'anell romà, marcant l'hora en format 24h
  const perla24 = el('g', {id:'perla24'});
  perla24.appendChild(el('ellipse', {cx:1.4, cy:2.3, rx:10, ry:7.6, fill:'#000000', opacity:'0.35'}));
  // Anell (part de darrere, passa per darrere de l'esfera)
  perla24.appendChild(el('ellipse', {
    cx:0, cy:0, rx:19, ry:5.6, fill:'none', stroke:'#bfe8e2', 'stroke-width':1.6, opacity:'0.55',
    transform:'rotate(-18)'
  }));
  perla24.appendChild(el('circle', {cx:0, cy:0, r:11, fill:'none', stroke:'#8a6d1f', 'stroke-width':1.5}));
  perla24.appendChild(el('circle', {cx:0, cy:0, r:10.5, fill:'url(#perlaBanda)', stroke:'#0a2e29', 'stroke-width':0.6}));
  perla24.appendChild(el('circle', {cx:-3, cy:-3.3, r:2.3, fill:'#ffffff', opacity:'0.8'}));
  // Anell (part de davant, passa per davant de l'esfera)
  perla24.appendChild(el('path', {
    d:'M -19,0 A 19,5.6 0 0,1 19,0', fill:'none', stroke:'#eafcfa', 'stroke-width':1.8, opacity:'0.9',
    transform:'rotate(-18)'
  }));
  svg.appendChild(perla24);

  // Marques de minut
  const ticksGrup = el('g', {stroke:'#3a2c10'});
  for(let i=0;i<60;i++){
    const ang = i*6;
    const major = (i%5===0);
    const r1 = 260, r2 = major? 250 : 254;
    ticksGrup.appendChild(el('line', {
      x1: polarX(CX,r1,ang), y1: polarY(CY,r1,ang),
      x2: polarX(CX,r2,ang), y2: polarY(CY,r2,ang),
      'stroke-width': major? 2 : 1
    }));
  }
  svg.appendChild(ticksGrup);

  svg.appendChild(el('circle', {cx:CX, cy:CY, r:195, fill:'none', stroke:'#6e5416', 'stroke-width':2}));

  // ---------- Anell zodiacal (gira segons l'època de l'any) ----------
  const zodiGrup = el('g', {id:'zodiGrup'});
  zodiGrup.appendChild(el('circle', {cx:CX, cy:CY, r:195, fill:'url(#orBanda)'}));
  zodiGrup.appendChild(el('circle', {cx:CX, cy:CY, r:165, fill:'var(--pedra)', style:'fill:#100c08'}));
  // Icones pròpies dels signes (traç vectorial, no emoticones) — Àries..Peixos, mateix ordre que fronteresZodiac
  const iconesZodiac = [
    [ {d:"M 0,8 C 0,4 -2,3 -4,3 C -7,3 -8,0 -6,-3 C -4,-6 -1,-5 -1,-2"},
      {d:"M 0,8 C 0,4 2,3 4,3 C 7,3 8,0 6,-3 C 4,-6 1,-5 1,-2"} ], // Àries
    [ {d:"M -4,-1 C -6,-6 -2,-8 0,-4"}, {d:"M 4,-1 C 6,-6 2,-8 0,-4"},
      {circ:true, cx:0, cy:4, r:4} ], // Taure
    [ {d:"M -6,-7 L 6,-7"}, {d:"M -6,7 L 6,7"}, {d:"M -3,-7 L -3,7"}, {d:"M 3,-7 L 3,7"} ], // Bessons
    [ {circ:true, cx:-4, cy:-3, r:2.3}, {circ:true, cx:4, cy:3, r:2.3},
      {d:"M -1.8,-3 C 2,-3 2,4 6.2,4"}, {d:"M 1.8,3 C -2,3 -2,-4 -6.2,-4"} ], // Cranc
    [ {circ:true, cx:-4, cy:2, r:3.2}, {d:"M -1,3 C 3,3 3,8 7,8.5"} ], // Lleó
    [ {d:"M -8,-7 L -8,7"}, {d:"M -8,-7 C -8,-7 -5.5,7 -3,-7"}, {d:"M -3,-7 C -3,-7 -0.5,7 2,-7"},
      {d:"M 2,-7 L 2,5"}, {circ:true, cx:4.3, cy:5, r:2.3} ], // Verge
    [ {d:"M -6,-6 C -6,-10 6,-10 6,-6"}, {d:"M -7,-2 L 7,-2"}, {d:"M -7,7 L 7,7"} ], // Balança
    [ {d:"M -8,-7 L -8,7"}, {d:"M -8,-7 C -8,-7 -5.5,7 -3,-7"}, {d:"M -3,-7 C -3,-7 -0.5,7 2,-7"},
      {d:"M 2,-7 L 2,4 L 6,4"}, {d:"M 6,4 L 4,1"}, {d:"M 6,4 L 4,7"} ], // Escorpí
    [ {d:"M -6,7 L 7,-6"}, {d:"M 7,-6 L 1,-6"}, {d:"M 7,-6 L 7,0"}, {d:"M -2,4 L 3,-1"} ], // Sagitari
    [ {d:"M -7,-6 C -7,2 -2,4 -1,0 C 0,-3 2,-2 2,2 C 2,6 6,7 7,3 C 8,0 6,-1 5,1"} ], // Capricorn
    [ {d:"M -8,-2 L -5,-5 L -2,-2 L 1,-5 L 4,-2 L 7,-5"}, {d:"M -8,4 L -5,1 L -2,4 L 1,1 L 4,4 L 7,1"} ], // Aquari
    [ {d:"M -3,-7 Q -9,0 -3,7"}, {d:"M 3,-7 Q 9,0 3,7"}, {d:"M -6,0 L 6,0"} ] // Peixos
  ];
  const zodiTextEls = [];
  iconesZodiac.forEach((icona,i)=>{
    const ang = i*30;
    // separadors
    zodiGrup.appendChild(el('line', {
      x1: polarX(CX,195,ang-15), y1: polarY(CY,195,ang-15),
      x2: polarX(CX,165,ang-15), y2: polarY(CY,165,ang-15),
      stroke:'#5c4a1c', 'stroke-width':1
    }));
    const tx = polarX(CX,180,ang), ty = polarY(CY,180,ang);
    const g = el('g', {
      transform: `translate(${tx}, ${ty})`,
      stroke:'#2a2005', 'stroke-width':1.7, fill:'none',
      'stroke-linecap':'round', 'stroke-linejoin':'round'
    });
    icona.forEach(part=>{
      if (part.circ){
        g.appendChild(el('circle', {cx:part.cx, cy:part.cy, r:part.r}));
      } else {
        g.appendChild(el('path', {d:part.d}));
      }
    });
    zodiGrup.appendChild(g);
    zodiTextEls.push({el:g, x:tx, y:ty});
  });
  svg.appendChild(zodiGrup);

  // punter fix del zodíac (marca "sol actual")
  svg.appendChild(el('path', {
    d:`M ${CX-8},${CY-202} L ${CX+8},${CY-202} L ${CX},${CY-188} Z`,
    fill:'#e8c04a', stroke:'#5c4a1c', 'stroke-width':1
  }));

  // ---------- Disc central: la fase lunar real, a mida completa ----------
  svg.appendChild(el('circle', {cx:CX, cy:CY, r:165, fill:'url(#ceil)'}));

  // estrelles (es veuen a la banda fosca de la lluna)
  const estels = el('g', {fill:'#f2d98a'});
  const rngSeed = 42;
  function pseudoRand(seed){ let x = Math.sin(seed)*10000; return x - Math.floor(x); }
  for(let i=0;i<40;i++){
    const a = pseudoRand(i*3.1+1)*360;
    const r = 20 + pseudoRand(i*7.7+2)*135;
    const rad = 0.6 + pseudoRand(i*5.3+3)*1;
    estels.appendChild(el('circle', {
      cx: polarX(CX,r,a), cy: polarY(CY,r,a), r: rad.toFixed(2), opacity: (0.4+pseudoRand(i*2.1)*0.6).toFixed(2)
    }));
  }
  svg.appendChild(estels);

  const lunaGranGrup = el('g', {id:'lunaGranGrup', transform:`translate(${CX}, ${CY})`});
  const lunaGranLit = el('path', {id:'lunaGranLit', fill:'url(#lunaGranBanda)'});
  lunaGranGrup.appendChild(lunaGranLit);
  svg.appendChild(lunaGranGrup);

  svg.appendChild(el('circle', {cx:CX, cy:CY, r:165, fill:'none', stroke:'#8a6d1f', 'stroke-width':1.5}));

  // ---------- Busques ----------
  function fletxa(id, longitud, amplada, color){
    const p = el('path', {
      id:id,
      d:`M ${CX},${CY+amplada*2.4} L ${CX-amplada/2},${CY} L ${CX-amplada/4},${CY-longitud} L ${CX+amplada/4},${CY-longitud} L ${CX+amplada/2},${CY} Z`,
      fill:color, stroke:'#000', 'stroke-width':0.4, 'stroke-linejoin':'round'
    });
    return p;
  }

  // busca de les hores (sol)
  const busquaHora = fletxa('busquaHora', 172, 9, 'url(#orBanda)');
  svg.appendChild(busquaHora);
  const solPunta = el('g', {id:'solPunta'});
  solPunta.appendChild(el('circle', {cx:0.9, cy:1.1, r:11, fill:'#5c3d0a', opacity:'0.4'}));
  solPunta.appendChild(el('circle', {cx:0, cy:0, r:11, fill:'url(#solBanda)', stroke:'#8a6d1f', 'stroke-width':1.2}));
  for(let i=0;i<8;i++){
    const a = i*45;
    solPunta.appendChild(el('line', {
      x1:0,y1:0, x2:0,y2:-17,
      transform:`rotate(${a})`,
      stroke:'#e8c04a','stroke-width':2, 'stroke-linecap':'round'
    }));
  }
  solPunta.appendChild(el('circle', {cx:-3.2, cy:-3.6, r:2.6, fill:'#ffffff', opacity:'0.55'}));
  svg.appendChild(solPunta);

  // busca dels minuts (lluna)
  const busquaMinut = fletxa('busquaMinut', 236, 7, '#cdd6e6');
  svg.appendChild(busquaMinut);
  const lunaPunta = el('g', {id:'lunaPunta'});
  lunaPunta.appendChild(el('circle', {cx:0, cy:0, r:12, fill:'url(#lunaDarkBanda)', stroke:'#8a97b8', 'stroke-width':1}));
  const lunaLit = el('path', {id:'lunaLit', fill:'url(#lunaLitBanda)'});
  lunaPunta.appendChild(lunaLit);
  svg.appendChild(lunaPunta);

  // busca dels segons
  const busquaSegon = el('line', {
    id:'busquaSegon', x1:CX, y1:CY+22, x2:CX, y2:CY-258,
    stroke:'#8a1f1f', 'stroke-width':1.6, 'stroke-linecap':'round'
  });
  svg.appendChild(busquaSegon);

  // eix central
  svg.appendChild(el('circle', {cx:CX, cy:CY, r:14, fill:'url(#nucli)', stroke:'#4a3a10', 'stroke-width':1.5}));
  svg.appendChild(el('circle', {cx:CX, cy:CY, r:4, fill:'#5c1616'}));

  // ==================== CALENDARI ====================
  const cal = document.getElementById('calendari');
  const CCX=150, CCY=150;
  cal.appendChild(el('circle', {cx:CCX, cy:CCY, r:148, fill:'url(#orBanda)'}));
  cal.appendChild(el('circle', {cx:CCX, cy:CCY, r:124, fill:'#0c0c0c'}));

  const calGrup = el('g', {id:'calGrup'});
  const mesos = ['GEN','FEB','MAR','ABR','MAI','JUN','JUL','AGO','SET','OCT','NOV','DES'];
  const mesosTextEls = [];
  mesos.forEach((m,i)=>{
    const ang = i*30;
    calGrup.appendChild(el('line', {
      x1: polarX(CCX,124,ang-15), y1: polarY(CCY,124,ang-15),
      x2: polarX(CCX,96,ang-15), y2: polarY(CCY,96,ang-15),
      stroke:'#5c4a1c', 'stroke-width':0.8
    }));
    const tx = polarX(CCX,110,ang), ty = polarY(CCY,110,ang)+4;
    const t = el('text', {
      x: tx, y: ty,
      fill:'#f0c65c', 'font-size':'10', 'font-weight':'700', 'text-anchor':'middle', 'letter-spacing':'1'
    });
    t.textContent = m;
    calGrup.appendChild(t);
    mesosTextEls.push({el:t, x:tx, y:ty});
  });
  calGrup.appendChild(el('circle', {cx:CCX, cy:CCY, r:96, fill:'url(#ceil)'}));
  const estelsCal = el('g', {fill:'#f2d98a'});
  for(let i=0;i<16;i++){
    const a = pseudoRand(i*9.3+11)*360;
    const r = 15 + pseudoRand(i*4.1+5)*75;
    estelsCal.appendChild(el('circle', {cx: polarX(CCX,r,a), cy: polarY(CCY,r,a), r: 0.7, opacity:'0.6'}));
  }
  calGrup.appendChild(estelsCal);
  const diaSetmanaText = el('text', {id:'diaSetmanaAbrev', x:CCX, y:CCY-22, 'text-anchor':'middle', 'font-size':'15', 'font-weight':'700', 'letter-spacing':'2', fill:'#f0c65c'});
  calGrup.appendChild(diaSetmanaText);
  const diaText = el('text', {id:'diaNum', x:CCX, y:CCY+26, 'text-anchor':'middle', 'font-size':'42', fill:'#f2d98a'});
  calGrup.appendChild(diaText);
  cal.appendChild(calGrup);

  cal.appendChild(el('circle', {cx:CCX, cy:CCY, r:124, fill:'none', stroke:'#8a6d1f', 'stroke-width':1}));
  cal.appendChild(el('path', {
    d:`M ${CCX-7},${CCY-140} L ${CCX+7},${CCY-140} L ${CCX},${CCY-124} Z`,
    fill:'#e8c04a', stroke:'#5c4a1c', 'stroke-width':0.8
  }));

  // ==================== LÒGICA ====================
  const diesSetmana = ['diumenge','dilluns','dimarts','dimecres','dijous','divendres','dissabte'];
  const abrevSetmana = ['DG','DL','DT','DC','DJ','DV','DS'];
  const nomsMesos = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];

  function diaDeLany(d){
    const inici = new Date(d.getFullYear(),0,0);
    const diff = d - inici;
    return Math.floor(diff / 86400000);
  }

  // Dona amplada fixa a cada xifra (evita que l'hora "balancegi" segons quins dígits surten)
  function formataHoraAmplaFixa(text){
    return text.split('').map(ch=>{
      if (ch === ':') return `<span class="separador-hora">:</span>`;
      return `<span class="xifra">${ch}</span>`;
    }).join('');
  }

  function faseLunar(d){
    // Referència: lluna nova real i propera (2026-08-12 17:38 UTC, eclipsi solar total).
    // Fer servir una referència propera enlloc d'una de fa 25 anys evita que l'error
    // orbital acumulat (l'òrbita lunar no és perfectament periòdica) desviï el resultat.
    // Convé refrescar aquesta data cada pocs anys perquè es mantingui precisa.
    const refNouLluna = Date.UTC(2026,7,12,17,38,0);
    const sinodic = 29.530588853;
    const dies = (d.getTime() - refNouLluna) / 86400000;
    let fase = (dies % sinodic) / sinodic;
    if (fase < 0) fase += 1;
    return fase; // 0=nova, 0.5=plena
  }

  function nomFaseLunar(fase){
    if (fase < 0.02 || fase > 0.98) return 'Lluna nova';
    if (fase < 0.24) return 'Lluna creixent';
    if (fase < 0.26) return 'Quart creixent';
    if (fase < 0.49) return 'Gibosa creixent';
    if (fase < 0.51) return 'Lluna plena';
    if (fase < 0.74) return 'Gibosa minvant';
    if (fase < 0.76) return 'Quart minvant';
    return 'Lluna minvant';
  }

  function pathLluna(r, fase){
    // fase 0..1, 0=nova, 0.5=plena — retorna la part il·luminada.
    // El sentit del traç del terminador ha de dependre de si estem al tram
    // falcat (creixent/minvant, resta àrea) o gibós (afegeix àrea cap a plena),
    // no només de si fase<0.5 — altrament la forma "rebota" cap enrere en
    // lloc de seguir creixent fins a plena.
    const theta = fase * 2 * Math.PI;
    const rx = r * Math.cos(theta);
    const sweepOuter = fase < 0.5 ? 1 : 0;
    const sweepInner = rx < 0 ? sweepOuter : (1 - sweepOuter);
    return `M 0,${-r} A ${r},${r} 0 0,${sweepOuter} 0,${r} A ${Math.abs(rx).toFixed(2)},${r} 0 0,${sweepInner} 0,${-r} Z`;
  }

  // Fronteres reals (dia de l'any, no bisest) de cada signe zodiacal i de cada mes,
  // per evitar l'error de repartir-los en trams uniformes de 30.4 dies.
  const fronteresZodiac = [80,110,141,172,204,235,266,296,326,356,385,415,445];
  function angleZodiacActual(doy){
    let doyAdj = doy < 80 ? doy + 365 : doy;
    let i = 11;
    for (let k=0;k<12;k++){
      if (doyAdj >= fronteresZodiac[k] && doyAdj < fronteresZodiac[k+1]){ i = k; break; }
    }
    const fraccio = (doyAdj - fronteresZodiac[i]) / (fronteresZodiac[i+1] - fronteresZodiac[i]);
    return (i - 0.5 + fraccio) * 30;
  }

  const fronteresMes = [1,32,60,91,121,152,182,213,244,274,305,335,366];
  function angleMesActual(doy){
    let m = 11;
    for (let k=0;k<12;k++){
      if (doy >= fronteresMes[k] && doy < fronteresMes[k+1]){ m = k; break; }
    }
    const fraccio = (doy - fronteresMes[m]) / (fronteresMes[m+1] - fronteresMes[m]);
    return (m - 0.5 + fraccio) * 30;
  }

  let zodiacActualitzat = false;
  let calendariActualitzat = false;

  function actualitza(){
    const ara = new Date();
    const h = ara.getHours() % 12;
    const m = ara.getMinutes();
    const s = ara.getSeconds();

    const angHora = h*30 + m*0.5;
    const angMinut = m*6 + s*0.1;
    const angSegon = s*6;

    busquaHora.setAttribute('transform', `rotate(${angHora}, ${CX}, ${CY})`);
    document.getElementById('solPunta').setAttribute('transform',
      `translate(${polarX(CX,172,angHora)}, ${polarY(CY,172,angHora)})`);

    busquaMinut.setAttribute('transform', `rotate(${angMinut}, ${CX}, ${CY})`);
    document.getElementById('lunaPunta').setAttribute('transform',
      `translate(${polarX(CX,236,angMinut)}, ${polarY(CY,236,angMinut)})`);

    busquaSegon.setAttribute('transform', `rotate(${angSegon}, ${CX}, ${CY})`);

    // Perla 24h: cavalca la vora exterior del rellotge, l'anell antic té el "24" (=0h) a dalt i avança 15° per hora
    const ang24 = (ara.getHours() + m/60 + s/3600) * 15;
    document.getElementById('perla24').setAttribute('transform',
      `translate(${polarX(CX,294,ang24)}, ${polarY(CY,294,ang24)})`);

    const hh = String(ara.getHours()).padStart(2,'0');
    const mm = String(m).padStart(2,'0');
    const ss = String(s).padStart(2,'0');
    document.getElementById('lecturaHora').innerHTML = formataHoraAmplaFixa(`${hh}:${mm}:${ss}`);

    const diaSetmana = diesSetmana[ara.getDay()];
    const diaMes = ara.getDate();
    const mes = nomsMesos[ara.getMonth()];
    const any = ara.getFullYear();
    const diaCap = diaSetmana.charAt(0).toUpperCase()+diaSetmana.slice(1);
    document.getElementById('lecturaData').textContent = `${diaCap}, ${diaMes} de ${mes} de ${any}`;

    const fase = faseLunar(ara);
    document.getElementById('lecturaLluna').textContent = nomFaseLunar(fase);
    lunaLit.setAttribute('d', pathLluna(12, fase));
    lunaGranLit.setAttribute('d', pathLluna(165, fase));

    if (!zodiacActualitzat){
      const doy = diaDeLany(ara);
      const angleZ = angleZodiacActual(doy);
      zodiGrup.setAttribute('transform', `rotate(${-angleZ}, ${CX}, ${CY})`);
      zodiTextEls.forEach(o=>{
        o.el.setAttribute('transform', `translate(${o.x}, ${o.y}) rotate(${angleZ})`);
      });
      zodiacActualitzat = true;
    }

    if (!calendariActualitzat){
      const doy = diaDeLany(ara);
      const angleM = angleMesActual(doy);
      calGrup.setAttribute('transform', `rotate(${-angleM}, ${CCX}, ${CCY})`);
      mesosTextEls.forEach(o=>{
        o.el.setAttribute('transform', `rotate(${angleM}, ${o.x}, ${o.y})`);
      });
      diaText.setAttribute('transform', `rotate(${angleM}, ${CCX}, ${CCY})`);
      diaText.textContent = diaMes;
      diaSetmanaText.setAttribute('transform', `rotate(${angleM}, ${CCX}, ${CCY})`);
      diaSetmanaText.textContent = abrevSetmana[ara.getDay()];
      calendariActualitzat = true;
    }
  }

  actualitza();
  setInterval(actualitza, 1000);

  // ---------- Ambient: temperatura i altitud reals (Open-Meteo) ----------
  function actualitzaAmbient(){
    if (!('geolocation' in navigator)) return;
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const { latitude, longitude } = pos.coords;
      try {
        const [rTemp, rElev] = await Promise.all([
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m`),
          fetch(`https://api.open-meteo.com/v1/elevation?latitude=${latitude}&longitude=${longitude}`)
        ]);
        const dTemp = await rTemp.json();
        const dElev = await rElev.json();
        const temp = (dTemp && dTemp.current) ? dTemp.current.temperature_2m : null;
        const elev = (dElev && dElev.elevation) ? dElev.elevation[0] : null;
        if (temp !== null && temp !== undefined){
          document.getElementById('lecturaTemp').textContent = `${temp.toFixed(1).replace('.', ',')}°C`;
        }
        if (elev !== null && elev !== undefined){
          document.getElementById('lecturaAlt').textContent = `${Math.round(elev)} m`;
        }
      } catch(err){
        console.warn("Orloj: no s'han pogut obtenir les dades ambientals", err);
      }
    }, (err)=>{
      console.warn('Orloj: geolocalització no disponible', err);
    }, { enableHighAccuracy:false, timeout:8000, maximumAge:600000 });
  }

  actualitzaAmbient();
  setInterval(actualitzaAmbient, 15*60*1000);
})();
</script>
